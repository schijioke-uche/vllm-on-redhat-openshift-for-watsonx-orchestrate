apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vllm-gpt-oss-20b-s390x-model-cache
  namespace: gpt-oss-20b
  labels:
    app.kubernetes.io/name: vllm-gpt-oss-20b-s390x
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 200Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: vllm-gpt-oss-20b-s390x-secrets
  namespace: gpt-oss-20b
  labels:
    app.kubernetes.io/name: vllm-gpt-oss-20b-s390x
type: Opaque
stringData:
  vllm-api-key: "9e1ae781-ec8207a3"
  hf-token: "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"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-gpt-oss-20b-s390x
  namespace: gpt-oss-20b
  labels:
    app.kubernetes.io/name: vllm-gpt-oss-20b-s390x
    app.kubernetes.io/component: vllm-openai-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm-gpt-oss-20b-s390x
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm-gpt-oss-20b-s390x
        app.kubernetes.io/component: vllm-openai-api
    spec:
      nodeSelector:
        kubernetes.io/arch: s390x
      terminationGracePeriodSeconds: 120
      containers:
        - name: vllm
          image: image-registry.openshift-image-registry.svc:5000/gpt-oss-20b/vllm-gpt-oss-20b-s390x:latest
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              exec python3 -m vllm.entrypoints.openai.api_server                 --model "${MODEL_ID}"                 --served-model-name "${SERVED_MODEL_NAME}"                 --host 0.0.0.0                 --port "${VLLM_PORT}"                 --dtype "${DTYPE}"                 --max-model-len "${MAX_MODEL_LEN}"                 --api-key "${VLLM_API_KEY}"                 ${EXTRA_VLLM_ARGS}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: MODEL_ID
              value: "unsloth/gpt-oss-20b"
            - name: SERVED_MODEL_NAME
              value: "gpt-oss-20b"
            - name: VLLM_PORT
              value: "8000"
            - name: DTYPE
              value: "auto"
            - name: MAX_MODEL_LEN
              value: "4096"
            - name: EXTRA_VLLM_ARGS
              value: ""
            - name: VLLM_TARGET_DEVICE
              value: "cpu"
            - name: VLLM_CPU_KVCACHE_SPACE
              value: "8"
            - name: HF_HOME
              value: /models/huggingface
            - name: TRANSFORMERS_CACHE
              value: /models/huggingface
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vllm-gpt-oss-20b-s390x-secrets
                  key: vllm-api-key
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vllm-gpt-oss-20b-s390x-secrets
                  key: hf-token
          resources:
            requests:
              cpu: 4
              memory: 16Gi
            limits:
              cpu: 8
              memory: 64Gi
          volumeMounts:
            - name: model-cache
              mountPath: /models
            - name: shm
              mountPath: /dev/shm
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 240
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: vllm-gpt-oss-20b-s390x-model-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: "8Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-gpt-oss-20b-s390x
  namespace: gpt-oss-20b
  labels:
    app.kubernetes.io/name: vllm-gpt-oss-20b-s390x
spec:
  selector:
    app.kubernetes.io/name: vllm-gpt-oss-20b-s390x
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: vllm-gpt-oss-20b-s390x
  namespace: gpt-oss-20b
  labels:
    app.kubernetes.io/name: vllm-gpt-oss-20b-s390x
spec:
  to:
    kind: Service
    name: vllm-gpt-oss-20b-s390x
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
